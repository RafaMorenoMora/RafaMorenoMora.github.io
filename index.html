<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iSweetHome | Domótica Inteligente y Control Total</title>

<meta name="description" content="Especialistas en domótica, automatización del hogar, seguridad inteligente y eficiencia energética.">
<meta name="keywords" content="domótica, hogar inteligente, smart home, automatización vivienda, seguridad, eficiencia energética">

<style>
:root{
    --bg:#fcfbfa;
    --card:#ffffff;
    --teal:#2a8a82;
    --teal-hover:#23726b;
    --brown:#5c3a21;
    --text:#2d3748;
    --muted:#64748b;
    --border:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8%;
    background:rgba(252,251,250,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:1.6rem;
    font-weight:700;
    color:var(--brown);
    text-decoration:none;
}

nav a{
    text-decoration:none;
    color:var(--muted);
    margin-left:24px;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:var(--teal);
}

.hero{
    max-width:1000px;
    margin:auto;
    padding:100px 8% 80px;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    background:rgba(42,138,130,.1);
    color:var(--teal);
    border-radius:30px;
    font-size:.9rem;
    font-weight:600;
    margin-bottom:20px;
}

.hero h1{
    font-size:3.4rem;
    line-height:1.1;
    color:var(--brown);
    margin-bottom:25px;
}

.hero p{
    font-size:1.2rem;
    color:var(--muted);
    max-width:750px;
    margin:auto;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:var(--teal);
    color:white;
    padding:15px 32px;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
    box-shadow:0 5px 15px rgba(42,138,130,.25);
}

.btn:hover{
    background:var(--teal-hover);
    transform:translateY(-2px);
}

section{
    padding:80px 8%;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
    color:var(--brown);
    font-size:2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:24px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:30px;
    transition:.3s;
    box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:15px;
    color:var(--brown);
}

.card p{
    color:var(--muted);
}

.cta{
    text-align:center;
    background:white;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.cta p{
    max-width:700px;
    margin:20px auto 35px;
    color:var(--muted);
}

footer{
    background:#ffffff;
    text-align:center;
    padding:40px 20px;
    border-top:1px solid var(--border);
}

footer p{
    color:var(--muted);
}

.whatsapp-float{
    position:fixed;
    right:25px;
    bottom:25px;
    width:65px;
    height:65px;
    background:#25D366;
    color:white;
    border-radius:50%;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    z-index:9999;
    transition:.3s;
}

.whatsapp
