<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iSweetHome | Domótica Inteligente y Control Total</title>

    <style>
        :root {
            --bg-dark: #fcfbfa;
            --bg-card: #ffffff;
            --primary-teal: #2a8a82;
            --primary-teal-hover: #23726b;
            --text-brown: #5c3a21;
            --text-main: #2d3748;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(252, 251, 250, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: .75rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            color: var(--primary-teal);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-brown);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: .95rem;
            font-weight: 500;
            transition: color .3s;
        }

        nav a:hover {
            color: var(--primary-teal);
        }

        .hero {
            text-align: center;
            padding: 5rem 8% 4rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .badge {
            display: inline-block;
            background: rgba(42,138,130,.1);
            color: var(--primary-teal);
            padding: .4rem 1rem;
            border-radius: 50px;
            font-size: .85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            color: var(--text-brown);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-teal);
            color: white;
            padding: .9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
            box-shadow: 0 4px 12px rgba(42,138,130,.2);
        }

        .btn:hover {
            background-color: var(--primary-teal-hover);
            transform: translateY(-2px);
        }

        .services,
        .use-cases {
            padding: 4rem 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
            color: var(--text-brown);
        }

        .grid,
        .use-cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
            gap: 1.5rem;
        }

        .card,
        .use-case {
            background: var(--bg-card);
            padding: 2.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,.02);
            transition: .3s;
        }
